<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third Eye Deals</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
    header { display: flex; justify-content: space-between; align-items: center; background: #222; color: #fff; padding: 15px; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    .btn { background: #25D366; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 5px; font-weight: bold; border: none; cursor: pointer; }
    .admin-panel { background: #fff; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
    input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h2>Third Eye Deals</h2>
  <button id="auth-btn" class="btn" style="background:#4285F4;" onclick="loginWithGoogle()">Admin Login</button>
</header>

<div id="admin-panel" class="admin-panel">
  <h3>Add New Product (Admin Only)</h3>
  <input type="text" id="p-name" placeholder="Product Name"><br>
  <input type="number" id="p-price" placeholder="Price (₹)"><br>
  <input type="text" id="p-img" placeholder="Image URL (e.g., https://...)"><br>
  <button class="btn" style="background:#28a745;" onclick="addProduct()">Add Product</button>
</div>

<div id="product-list" class="grid"></div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDc14-V4g44-ly2wM1l8",
    authDomain: "third-eye-deals.firebaseapp.com",
    projectId: "third-eye-deals",
    storageBucket: "third-eye-deals.firebasestorage.app",
    messagingSenderId: "419383554702",
    appId: "1:419383554702:web:f8b5774e",
    measurementId: "G-GY97V0912L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // Admin Gmail ID (Case-insensitive check ke sath)
  const ADMIN_EMAIL = "www.thirdeyedeals@gmail.com"; 

  window.loginWithGoogle = () => {
    signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
  };

  onAuthStateChanged(auth, user => {
    const adminPanel = document.getElementById("admin-panel");
    const authBtn = document.getElementById("auth-btn");
    
    if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
      adminPanel.style.display = "block";
      authBtn.innerText = "Logged in as Admin";
    } else {
      adminPanel.style.display = "none";
      authBtn.innerText = "Admin Login";
      if(user) alert("You are not authorized as Admin!");
    }
  });

  window.addProduct = async () => {
    const name = document.getElementById("p-name").value;
    const price = document.getElementById("p-price").value;
    const img = document.getElementById("p-img").value;

    if (!name || !price || !img) return alert("Please fill all fields!");

    try {
      await addDoc(collection(db, "products"), { name, price, img });
      alert("Product Added Successfully!");
      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-img").value = "";
    } catch (e) {
      alert("Error adding product: " + e.message);
    }
  };

  // Real-time product fetch
  onSnapshot(collection(db, "products"), (snapshot) => {
    const grid = document.getElementById("product-list");
    grid.innerHTML = "";
    snapshot.forEach(doc => {
      const p = doc.data();
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <h4>${p.name}</h4>
          <p>₹${p.price}</p>
          <a class="btn" href="https://wa.me/919076382864?text=I want to buy ${p.name}">Buy via WhatsApp</a>
        </div>
      `;
    });
  });
</script>

</body>
  </html>
