<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third Eye Deals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000000; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header UI */
    header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 12px 20px; border-radius: 0 0 16px 16px; margin-bottom: 10px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #000000; font-weight: bold; display: flex; align-items: center; }
    .brand-title { color: #00c853; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
    .admin-btn { background: #000000; color: #ffffff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
    
    /* Side Drawer Navigation */
    .drawer { position: fixed; top: 0; left: -280px; width: 270px; height: 100%; background: #0b1329; border-right: 1px solid #1e293b; transition: 0.3s ease; z-index: 1000; padding: 20px; overflow-y: auto; }
    .drawer.active { left: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 15px; }
    .drawer-title { color: #00c853; font-size: 22px; font-weight: bold; }
    .close-btn { background: none; border: none; color: #ffffff; font-size: 24px; cursor: pointer; }
    
    /* World Languages Selector Box */
    .lang-box { background: #152238; padding: 8px 10px; border-radius: 8px; margin-bottom: 15px; }
    .lang-box label { font-size: 12px; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 4px; }
    .lang-select { width: 100%; background: #0b1329; color: #00c853; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }

    .drawer ul { list-style: none; }
    .drawer ul li { margin: 16px 0; }
    .drawer ul li a { color: #ffffff; text-decoration: none; font-size: 16px; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .drawer ul li a:hover { color: #00c853; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 999; }
    .overlay.active { display: block; }

    /* Admin Panel */
    .admin-panel { background: #0b1329; border: 1px solid #1e293b; padding: 15px; border-radius: 12px; margin: 15px; display: none; }
    .admin-panel input { width: 100%; padding: 10px; margin: 6px 0; background: #152238; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    .add-btn { background: #00c853; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }

    /* Content Area */
    .main-content { flex: 1; padding: 15px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .card { background: #0b1329; border: 1px solid #1e293b; border-radius: 16px; padding: 12px; text-align: center; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; background: #fff; }
    .card h3 { font-size: 16px; margin: 10px 0 5px; color: #ffffff; }
    .card .price { color: #00c853; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .buy-btn { background: #00c853; color: #ffffff; text-decoration: none; display: block; padding: 10px; border-radius: 8px; font-weight: bold; }

    /* Compact Footer */
    footer { background: #0b1329; border-top: 1px solid #1e293b; padding: 14px 10px; margin-top: auto; text-align: center; color: #94a3b8; font-size: 13px; }
    .footer-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .footer-links a { color: #ffffff; text-decoration: none; font-size: 13px; }
    .footer-links a:hover { color: #00c853; }
  </style>
</head>
<body>

    </select>
  </div>

  <ul>
    <li><a href="#">🏫 Home</a></li>
    <li><a href="mailto:www.thirdeyedeals@gmail.com?subject=Customer%20Support">📞 Customer Support</a></li>

</div>

<header>
  <div class="header-left">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="brand-title">🛍️ THIRD EYE</div>
  </div>
  <button id="auth-btn" class="admin-btn" onclick="loginWithGoogle()">Admin Login</button>
</header>

<div id="admin-panel" class="admin-panel">
  <h3 style="color:#00c853; margin-bottom:10px;">Add New Product (Admin Only)</h3>
  <input type="text" id="p-name" placeholder="Product Name">
  <input type="number" id="p-price" placeholder="Price (₹)">
  <input type="text" id="p-img" placeholder="Image URL (e.g., https://...)">
  <button class="add-btn" onclick="addProduct()">Add Product</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDc14-V4g44-ly2wM1l8",
    authDomain: "third-eye-deals.firebaseapp.com",
    projectId: "third-eye-deals",
    storageBucket: "third-eye-deals.firebasestorage.app",
    messagingSenderId: "419383554702",
    appId: "1:419383554702:web:f8b5774e",
    measurementId: "G-GY97V0912L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const ADMIN_EMAIL = "www.thirdeyedeals@gmail.com"; 

  window.toggleMenu = () => {
    document.getElementById("drawer").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
  };

  window.loginWithGoogle = () => {
    signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
  };

  onAuthStateChanged(auth, user => {
    const adminPanel = document.getElementById("admin-panel");
    const authBtn = document.getElementById("auth-btn");
    
    if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
      adminPanel.style.display = "block";
      authBtn.innerText = "Admin Dashboard";
    } else {
      adminPanel.style.display = "none";
      authBtn.innerText = "Admin Login";
      if(user) alert("You are not authorized as Admin!");
    }
  });

  window.addProduct = async () => {
    const name = document.getElementById("p-name").value;
    const price = document.getElementById("p-price").value;
    const img = document.getElementById("p-img").value;

    if (!name || !price || !img) return alert("Please fill all fields!");

    try {
      await addDoc(collection(db, "products"), { name, price, img });
      alert("Product Added Successfully!");
      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-img").value = "";
    } catch (e) {
      alert("Error adding product: " + e.message);
    }
  };

  onSnapshot(collection(db, "products"), (snapshot) => {
    const grid = document.getElementById("product-list");
    grid.innerHTML = "";
    snapshot.forEach(doc => {
      const p = doc.data();
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <div class="price">₹${p.price}</div>
          <a class="buy-btn" href="mailto:www.thirdeyedeals@gmail.com?subject=Order%20Query%20for%20${encodeURIComponent(p.name)}">Buy Now / Inquiry</a>
        </div>
      `;
    });
  });
</script>

</body>
